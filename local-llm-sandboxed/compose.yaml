services:
  local-llm-sandboxed:
    image: local-llm-sandboxed:1
    build:
      context: .
      additional_contexts:
        dotfiles: /home/irae/.dotfiles
        sshkeys: /home/irae/.ssh
    container_name: local-llm-sandboxed
    restart: unless-stopped
    user: "0:0"
    environment:
      SSHD_ALLOW_USERS: haku
      SSHD_PERMIT_ROOT_LOGIN: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - SYS_CHROOT
      - AUDIT_WRITE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/sshd
    volumes:
      - /data/volumes/local-llm-sandboxed:/home/haku
      - /data/volumes/local-llm-sandboxed/ssh-hostkeys:/var/lib/ssh-hostkeys
    networks:
      sandbox:
        ipv4_address: 172.30.70.10
      restricted-mail:
        ipv4_address: 172.19.0.250
    healthcheck:
      test: ["CMD", "pi", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["/usr/local/bin/sshd-run.sh"]
    ports:
      - "0.0.0.0:2201:22"

networks:
  sandbox:
    name: local-llm-sandboxed
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.70.0/24
  restricted-mail:
    external: true
    name: restricted-mail
