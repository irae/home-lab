services:
  local-llm-sandboxed:
    build: .
    image: local-llm-sandboxed:1
    container_name: local-llm-sandboxed
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - /data/volumes/local-llm-sandboxed:/home/haku
    networks:
      sandbox:
        ipv4_address: 172.30.70.10
      restricted-mail:
        ipv4_address: 172.19.0.250
    healthcheck:
      test: ["CMD", "pi", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["sleep", "infinity"]

networks:
  sandbox:
    name: local-llm-sandboxed
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.70.0/24
  restricted-mail:
    external: true
    name: restricted-mail
