services:
  hermes:
    image: hermes-ssh:latest
    build:
      context: .
      additional_contexts:
        sshkeys: /home/irae/.ssh
        sshd: /data/stacks/local-llm-sandboxed
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
    env_file:
      - /data/volumes/hermes/.env
    ports:
      - "0.0.0.0:5006:9119"
      - "0.0.0.0:7390:8642"
      - "0.0.0.0:2202:22"
    volumes:
      - type: bind
        source: /data/volumes/hermes
        target: /opt/data
        bind:
          create_host_path: false
      - /data/volumes/hermes/ssh-hostkeys:/var/lib/ssh-hostkeys
    security_opt:
      - no-new-privileges:true
    shm_size: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
