services:
  restricted-mail:
    build:
      context: ${APP_DIR}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:${HOST_PORT}:8080"
    tmpfs:
      - /tmp
    volumes:
      - ${SENDERS_FILE}:/config/senders.yaml:ro
      - ${LOG_DIR}:/log
    secrets:
      - fastmail_token
    healthcheck:
      test: ["CMD", "deno", "eval", "--allow-net=localhost:8080", "const r = await fetch('http://localhost:8080/health'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - restricted-mail

