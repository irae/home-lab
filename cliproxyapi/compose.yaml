services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    user: "1000:1000"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /data
    command: ["/CLIProxyAPI/CLIProxyAPI", "-config", "/data/config.yaml"]
    environment:
      HOME: /data
      MANAGEMENT_STATIC_PATH: /data/static
    ports:
      - "127.0.0.1:5009:8317"
    volumes:
      - type: bind
        source: /data/volumes/cliproxyapi
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
