services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    # Upstream image runs as root with no application user; pin UID/GID 1000
    # and keep HOME/working_dir under /data so all state stays in the private bind mount.
    user: "1000:1000"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /data
    command: ["/CLIProxyAPI/CLIProxyAPI", "-config", "/data/config.yaml"]
    environment:
      HOME: /data
      MANAGEMENT_STATIC_PATH: /data/static
    # Loopback-only so Docker starts before Tailscale; Tailscale Serve publishes HTTPS on 5009.
    # Docker's bridge makes forwarded requests non-local inside the container, so config.yaml
    # needs server.host: "" and management.allow-remote: true.
    ports:
      - "127.0.0.1:5009:8317"
    volumes:
      - type: bind
        source: /data/volumes/cliproxyapi
        target: /data
        bind:
          create_host_path: false
    # Upstream debian:bookworm image omits curl and wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
