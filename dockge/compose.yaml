services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports:
      # All interfaces; Dockge has its own login. Tighten later if needed.
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Upstream uses ./data next to compose; keep runtime off the git tree.
      - /data/volumes/dockge:/app/data
      # Host path must equal container path (Dockge requirement).
      - /data/stacks:/data/stacks
    environment:
      - DOCKGE_STACKS_DIR=/data/stacks
      # So files Dockge writes in stacks are irae:irae, not root.
      - PUID=1000
      - PGID=1000
    # Image already HEALTHCHECKs extra/healthcheck.
