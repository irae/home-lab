# sheeta-lan-share
# VLC guest sessions fail when the server requires SMB signing.

[global]
workgroup = WORKGROUP
server role = standalone server
netbios name = sheeta
server string = sheeta
disable netbios = no
local master = yes
preferred master = yes
os level = 20
dns proxy = no
wins support = no

security = user
map to guest = Bad User
guest account = nobody
restrict anonymous = 0

server min protocol = SMB2
server signing = disabled
server smb encrypt = off

vfs objects = fruit streams_xattr
fruit:metadata = stream
fruit:model = MacSamba
fruit:veto_appledouble = no
fruit:nfs_aces = no
fruit:wipe_intentionally_left_blank_rfork = yes
fruit:delete_empty_adfiles = yes

# Samba looks up an interface name with no address as a DNS name. Through
# Tailscale DNS that takes 40 s, and the Finder share list times out.
bind interfaces only = yes
interfaces = lo 192.168.1.0/24
hosts allow = 127.0.0.1 192.168.1.0/24

load printers = no
printing = bsd
printcap name = /dev/null

allow dcerpc auth level connect:srvsvc = yes

log file = /var/log/samba/log.%m
max log size = 1000

include = /etc/samba/includes.conf
