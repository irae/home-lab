services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15-rootless
    user: "1000:1000"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
      FORGEJO__server__ROOT_URL: "${FORGEJO_ROOT_URL:-http://localhost:4005/}"
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_DOMAIN: forgejo
      FORGEJO__server__SSH_PORT: "22"
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__USE_COMPAT_SSH_URI: "false"
      FORGEJO__actions__ENABLED: "false"
    ports:
      - "127.0.0.1:4005:3000"
      - "${FORGEJO_BIND_IP:-127.0.0.1}:2203:22"
    volumes:
      - type: bind
        source: /data/volumes/forgejo
        target: /var/lib/gitea
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
